<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정밀 자미두수 & 주역 6효 사주 풀이</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent-gold: #ffd700;
      --accent-purple: #9d4edd;
      --text-light: #e0e0e0;
      --border-color: #3a3252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Malgun Gothic', sans-serif;
      padding: 20px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-purple);
    }
    header h1 { color: var(--accent-gold); font-size: 2.2rem; margin-bottom: 10px; }

    .input-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group { display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 6px; color: var(--accent-gold); font-weight: bold; }
    .form-group input, .form-group select {
      padding: 10px; background: #251f3d; border: 1px solid var(--border-color);
      color: #fff; border-radius: 6px; font-size: 1rem;
    }

    .submit-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple), #5a189a);
      color: #fff; border: none; border-radius: 8px;
      font-size: 1.2rem; font-weight: bold; cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #7b2cbf, #3c096c);
      box-shadow: 0 0 12px var(--accent-purple);
    }

    #result-area { display: none; }

    .section-title {
      color: var(--accent-gold);
      border-left: 4px solid var(--accent-purple);
      padding-left: 10px; margin: 35px 0 15px 0; font-size: 1.5rem;
    }

    /* 자미두수 12궁 그리드 */
    .ziwei-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 30px;
    }
    .ziwei-cell {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 10px; min-height: 110px; position: relative;
    }
    .ziwei-cell.center-cell {
      grid-column: span 2; grid-row: span 2; background: #151022;
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; border: 2px solid var(--accent-purple);
    }
    .palace-name { position: absolute; bottom: 6px; right: 8px; font-weight: bold; color: var(--accent-gold); }
    .branch-name { position: absolute; bottom: 6px; left: 8px; color: #888; font-size: 0.8rem; }
    .stars-main { color: #ff4d4d; font-weight: bold; }

    /* 주역 6효 디스플레이 */
    .iching-container {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border-color); margin-bottom: 30px;
    }
    .hex-lines-list { display: flex; flex-direction: column-reverse; gap: 10px; margin-top: 15px; }
    .hex-line-item {
      display: flex; align-items: center; gap: 15px; background: #221c38;
      padding: 10px; border-radius: 6px; border-left: 4px solid transparent;
    }
    .hex-line-item.is-moving { border-left-color: var(--accent-gold); background: #2d244a; }
    .line-graphic { width: 100px; height: 14px; flex-shrink: 0; }
    .line-yang { height: 100%; background: var(--accent-gold); border-radius: 2px; }
    .line-yin { height: 100%; display: flex; justify-content: space-between; }
    .line-yin::before, .line-yin::after { content: ''; width: 45%; height: 100%; background: #777; border-radius: 2px; }
    .line-info { flex-grow: 1; font-size: 0.95rem; }
    .line-num { font-weight: bold; color: var(--accent-gold); margin-right: 8px; }
    .moving-tag { background: var(--accent-purple); color: #fff; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

    /* 대운 타임라인 */
    .daeun-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 30px;
    }
    .daeun-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 15px; border-radius: 8px; text-align: center;
    }
    .daeun-age { color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }

    /* 월별 운세 그리드 */
    .monthly-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px; margin-bottom: 30px;
    }
    .month-card {
      background: #181328; border: 1px solid var(--border-color);
      padding: 10px; border-radius: 6px; text-align: center;
    }
    .month-title { color: var(--accent-purple); font-weight: bold; margin-bottom: 4px; }

    .report-card {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border-color); margin-bottom: 15px; line-height: 1.7;
    }
    .report-card h3 { color: var(--accent-gold); margin-bottom: 10px; }

    @media (max-width: 600px) {
      .ziwei-grid { grid-template-columns: repeat(2, 1fr); }
      .ziwei-cell.center-cell { grid-column: span 2; grid-row: span 1; }
      .hex-line-item { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>

  <div class="input-card">

            <option value="6">오시 (11:00 ~ 13:00)</option>

        </div>
      </div>
      <button type="submit" class="submit-btn">🔮 종합 사주 & 대운·월운 풀이 보기</button>
    </form>
  </div>

  <div id="result-area">
    <!-- 자미두수 명반 -->
    <h2 class="section-title">✨ 자미두수 12궁 명반</h2>
    <div class="ziwei-grid" id="ziweiBoard"></div>

    <!-- 주역 64괘 및 1효~6효 전체 -->
    <h2 class="section-title">☯ 주역 64괘 & 1효~6효 상세 분석</h2>
    <div class="iching-container">
      <h3 id="ichingTitle" style="color: var(--accent-gold); font-size: 1.3rem;"></h3>
      <p id="ichingSummary" style="color: #aaa; margin-top: 5px;"></p>
      <div class="hex-lines-list" id="hexLinesList"></div>
    </div>

    <!-- 대운 흐름 -->
    <h2 class="section-title">⏳ 10년 단위 대운(大運) 흐름</h2>
    <div class="daeun-grid" id="daeunBoard"></div>

    <!-- 월별 운세 -->
    <h2 class="section-title">📅 12개월 월별 운세 흐름</h2>
    <div class="monthly-grid" id="monthlyBoard"></div>

    <!-- 종합 리포트 -->
    <h2 class="section-title">📜 종합 운세 총평 및 조언</h2>
    <div class="report-card">
      <h3>🌟 타고난 성품과 명궁(命宮)</h3>
      <p id="mainStarReport"></p>
    </div>
    <div class="report-card">
      <h3>💰 재물 및 사업 운세</h3>
      <p id="wealthReport"></p>
    </div>
  </div>
</div>
