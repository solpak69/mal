<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정밀 자미두수 & 주역 사주 운세 풀이</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent-gold: #ffd700;
      --accent-purple: #9d4edd;
      --text-light: #e0e0e0;
      --border-color: #3a3252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Malgun Gothic', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-purple);
    }
    header h1 {
      color: var(--accent-gold);
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* 입력 폼 */
    .input-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      margin-bottom: 6px;
      color: var(--accent-gold);
      font-weight: bold;
    }
    .form-group input, .form-group select {
      padding: 10px;
      background: #251f3d;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple), #5a189a);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #7b2cbf, #3c096c);
      box-shadow: 0 0 10px var(--accent-purple);
    }

    /* 결과 영역 */
    #result-area { display: none; }

    .section-title {
      color: var(--accent-gold);
      border-left: 4px solid var(--accent-purple);
      padding-left: 10px;
      margin: 30px 0 15px 0;
      font-size: 1.5rem;
    }

    /* 자미두수 12궁 그리드 */
    .ziwei-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 30px;
    }
    .ziwei-cell {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      min-height: 120px;
      position: relative;
    }
    .ziwei-cell.center-cell {
      grid-column: span 2;
      grid-row: span 2;
      background: #151022;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid var(--accent-purple);
    }
    .palace-name {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 0.9rem;
    }
    .branch-name {
      position: absolute;
      bottom: 6px;
      left: 8px;
      color: #888;
      font-size: 0.8rem;
    }
    .stars-main {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .stars-sub {
      color: #4da6ff;
      font-size: 0.8rem;
    }

    /* 주역 괘 시각화 */
    .iching-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 30px;
    }
    .hexagram-visual {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      width: 120px;
    }
    .line-yang {
      height: 12px;
      background: var(--accent-gold);
      border-radius: 2px;
    }
    .line-yin {
      height: 12px;
      display: flex;
      justify-content: space-between;
    }
    .line-yin::before, .line-yin::after {
      content: '';
      width: 45%;
      height: 100%;
      background: #777;
      border-radius: 2px;
    }

    /* 리포트 카드 */
    .report-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
      line-height: 1.7;
    }
    .report-card h3 {
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .ziwei-grid { grid-template-columns: repeat(2, 1fr); }
      .ziwei-cell.center-cell { grid-column: span 2; grid-row: span 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>☯ 정밀 자미두수 & 주역 사주 풀이</h1>
    <p>태어난 날과 시간에 맞춰 고유한 자미두수 주성 및 주역 괘를 도출하여 풀이합니다.</p>
  </header>

  <!-- 입력 폼 -->
  <div class="input-card">
    <form id="sajuForm">
      <div class="form-grid">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="username" value="홍길동" required>
        </div>
        <div class="form-group">
          <label>성별</label>
          <select id="gender">
            <option value="남">남성</option>
            <option value="여">여성</option>
          </select>
        </div>
        <div class="form-group">
          <label>생년월일</label>
          <input type="date" id="birthdate" value="1990-01-01" required>
        </div>
        <div class="form-group">
          <label>출생 시간</label>
          <select id="birthtime">
            <option value="0">자시 (23:00 ~ 01:00)</option>
            <option value="1">축시 (01:00 ~ 03:00)</option>
            <option value="2">인시 (03:00 ~ 05:00)</option>
            <option value="3">묘시 (05:00 ~ 07:00)</option>
            <option value="4">진시 (07:00 ~ 09:00)</option>
            <option value="5" selected>사시 (09:00 ~ 11:00)</option>
            <option value="6">오시 (11:00 ~ 13:00)</option>
            <option value="7">미시 (13:00 ~ 15:00)</option>
            <option value="8">신시 (15:00 ~ 17:00)</option>
            <option value="9">유시 (17:00 ~ 19:00)</option>
            <option value="10">술시 (19:00 ~ 21:00)</option>
            <option value="11">해시 (21:00 ~ 23:00)</option>
          </select>
        </div>
      </div>
      <button type="submit" class="submit-btn">🔮 정밀 사주 & 운세 풀이 보기</button>
    </form>
  </div>

  <!-- 결과 영역 -->
  <div id="result-area">
    
    <h2 class="section-title">✨ 자미두수(紫微斗數) 12궁 명반</h2>
    <div class="ziwei-grid" id="ziweiBoard"></div>

    <h2 class="section-title">☯ 주역(周易) 괘 분석</h2>
    <div class="iching-box">
      <div class="hexagram-visual" id="hexagramVisual"></div>
      <div>
        <h3 id="ichingTitle" style="color: var(--accent-gold); margin-bottom: 8px;"></h3>
        <p id="ichingDesc" style="color: #ccc;"></p>
      </div>
    </div>

    <h2 class="section-title">📜 상세 사주 리포트</h2>
    <div class="report-card">
      <h3>🌟 명궁(命宮) 주성 분석 및 본성</h3>
      <p id="mainStarReport"></p>
    </div>
    <div class="report-card">
      <h3>💰 재물운 & 사업/직업운</h3>
      <p id="wealthReport"></p>
    </div>
    <div class="report-card">
      <h3>❤️ 애정운 & 대인관계</h3>
      <p id="relationReport"></p>
    </div>
    <div class="report-card">
      <h3>💡 주역 괘 기반 행동 지침</h3>
      <p id="actionReport"></p>
    </div>

  </div>
</div>

<script>
const BRANCHES = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];
const PALACES = ["명궁(命宮)", "형제궁", "부처궁", "자녀궁", "재백궁", "질악궁", "천이궁", "노복궁", "관록궁", "전택궁", "복덕궁", "부모궁"];

// 14개 주성 데이터 및 별별 특성 풀이 DB
const STAR_DB = [
  { name: "자미(紫微)", desc: "제왕의 별입니다. 리더십이 뛰어나고 품위가 있으며 스스로 개척해 나가는 리더의 기운을 가지고 있습니다." },
  { name: "천기(天機)", desc: "지혜와 기획의 별입니다. 두뇌 회전이 빠르고 아이디어가 뛰어나며 기획이나 연구 분야에서 두각을 나타냅니다." },
  { name: "태양(太陽)", desc: "베풂과 활력의 별입니다. 공정하고 정당한 것을 좋아하며 타인을 이끄는 밝은 에너지를 발산합니다." },
  { name: "무곡(武曲)", desc: "재물과 결단력의 별입니다. 실리적이고 강한 추진력을 갖고 있어 재정을 관리하거나 사업을 이끄는 데 강점이 있습니다." },
  { name: "천동(天同)", desc: "복덕과 조화의 별입니다. 평화롭고 온화한 성품으로 유연한 사고방식을 가지며 사람들과의 화합을 중요시합니다." },
  { name: "염정(廉貞)", desc: "창의와 신념의 별입니다. 원칙을 지키면서도 독창성이 뛰어나며 자기 분야에 대한 자부심이 강합니다." },
  { name: "천부(天府)", desc: "안정과 포용의 별입니다. 신중하고 포용력이 커서 남들을 잘 다독이며, 안정적인 자산 구축에 유리합니다." },
  { name: "태음(太陰)", desc: "섬세함과 직관의 별입니다. 감수성이 풍부하고 치밀하며 조용하게 자신의 실속을 챙기는 능력이 탁월합니다." },
  { name: "탐랑(貪狼)", desc: "다재다능과 사교의 별입니다. 호기심이 많고 대인관계가 좋으며 다양한 분야에서 재능을 발휘합니다." },
  { name: "거문(巨門)", desc: "분석과 변론의 별입니다. 비판적 사고와 말솜씨가 뛰어나 전문적인 지식을 전달하거나 설득하는 데 강합니다." },
  { name: "천상(天相)", desc: "조율과 서비스의 별입니다. 단정하고 예의가 바르며, 중간에서 중재하는 역할이나 보좌하는 일에 탁월합니다." },
  { name: "천량(天梁)", desc: "후덕과 중재의 별입니다. 어른스럽고 남을 돕는 봉사 정신이 깊으며 귀인의 도움을 많이 받는 사주입니다." },
  { name: "칠살(七殺)", desc: "장수와 개척의 별입니다. 모험심이 강하고 독자적인 길을 개척하는 추진력이 매우 강력합니다." },
  { name: "파군(破軍)", desc: "혁신과 변화의 별입니다. 기존의 틀을 깨고 새로운 것을 창조해내는 과감한 에너지를 지니고 있습니다." }
];

const SUB_STARS = ["좌보", "우필", "문창", "문곡", "록존", "천괴", "천월", "경양", "타라", "화성", "령성"];

// 주역 8괘 데이터
const TRIGRAMS = [
  { name: "천(天/건)", nature: "하늘", element: "강건함과 강한 추진력", lines: [1, 1, 1] },
  { name: "택(澤/태)", nature: "못", element: "기쁨과 활발한 소통", lines: [1, 1, 0] },
  { name: "화(火/리)", nature: "불", element: "명확함과 지혜로운 열정", lines: [1, 0, 1] },
  { name: "뢰(雷/진)", nature: "벼락", element: "새로운 시작과 활력", lines: [1, 0, 0] },
  { name: "풍(風/손)", nature: "바람", element: "유연함과 침투력", lines: [0, 1, 1] },
  { name: "수(水/감)", nature: "물", element: "지혜와 신중한 위험 관리", lines: [0, 1, 0] },
  { name: "산(山/간)", nature: "산", element: "절제와 차분한 인내", lines: [0, 0, 1] },
  { name: "지(地/곤)", nature: "땅", element: "포용력과 순응하는 덕", lines: [0, 0, 0] }
];

document.getElementById('sajuForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const name = document.getElementById('username').value;
  const gender = document.getElementById('gender').value;
  const birthdate = new Date(document.getElementById('birthdate').value);
  const birthtime = parseInt(document.getElementById('birthtime').value);

  const year = birthdate.getFullYear();
  const month = birthdate.getMonth() + 1;
  const day = birthdate.getDate();

  // 1. 명궁 위치 계산: (월 - 시 + 12) % 12
  let mingIndex = (month - birthtime + 12) % 12;
  
  // 2. 명궁 주성 계산 (년+월+일 조합)
  let mainStarIndex = (year + month + day + mingIndex) % STAR_DB.length;
  let targetStar = STAR_DB[mainStarIndex];

  generateZiweiBoard(name, year, month, day, mingIndex, mainStarIndex);

  // 3. 주역 괘 계산
  let upperIdx = (year + month + day) % 8;
  let lowerIdx = (year + month + day + birthtime) % 8;
  let moveLine = ((year + month + day + birthtime) % 6) + 1;

  generateIching(upperIdx, lowerIdx, moveLine);

  // 4. 풍부한 리포트 생성
  generateReport(name, targetStar, TRIGRAMS[upperIdx], TRIGRAMS[lowerIdx], moveLine, year, birthtime);

  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
});

function generateZiweiBoard(name, year, month, day, mingIdx, mainStarIdx) {
  const board = document.getElementById('ziweiBoard');
  board.innerHTML = '';

  let palaceMap = {};
  for(let i = 0; i < 12; i++) {
    let idx = (mingIdx + i) % 12;
    palaceMap[idx] = PALACES[i];
  }

  const gridPositions = [
    { row: 4, col: 1, branch: 0 }, { row: 4, col: 2, branch: 1 },
    { row: 4, col: 3, branch: 2 }, { row: 4, col: 4, branch: 3 },
    { row: 3, col: 4, branch: 4 }, { row: 2, col: 4, branch: 5 },
    { row: 1, col: 4, branch: 6 }, { row: 1, col: 3, branch: 7 },
    { row: 1, col: 2, branch: 8 }, { row: 1, col: 1, branch: 9 },
    { row: 2, col: 1, branch: 10 }, { row: 3, col: 1, branch: 11 }
  ];

  const centerCell = document.createElement('div');
  centerCell.className = 'ziwei-cell center-cell';
  centerCell.innerHTML = `
    <h3 style="color:var(--accent-gold);">${name} 님의 명반</h3>
    <p style="margin-top:8px; font-size:0.9rem; color:#aaa;">${year}년 ${month}월 ${day}일생</p>
    <p style="font-size:0.85rem; color:var(--accent-purple); margin-top:5px;">[ 주성: ${STAR_DB[mainStarIdx].name} ]</p>
  `;

  gridPositions.forEach((pos) => {
    const cell = document.createElement('div');
    cell.className = 'ziwei-cell';
    cell.style.gridRow = pos.row;
    cell.style.gridColumn = pos.col;

    // 각 궁마다 주성 배치
    let starIdx = (mainStarIdx + pos.branch) % STAR_DB.length;
    let mainStarName = STAR_DB[starIdx].name;
    let subStarName = SUB_STARS[(pos.branch + month) % SUB_STARS.length];

    cell.innerHTML = `
      <div class="stars-main">${mainStarName}</div>
      <div class="stars-sub">${subStarName}</div>
      <div class="palace-name">${palaceMap[pos.branch]}</div>
      <div class="branch-name">${BRANCHES[pos.branch]}</div>
    `;

    board.appendChild(cell);
  });

  board.appendChild(centerCell);
}

function generateIching(upperIdx, lowerIdx, moveLine) {
  const upper = TRIGRAMS[upperIdx];
  const lower = TRIGRAMS[lowerIdx];
  const lines = [...lower.lines, ...upper.lines];

  const visual = document.getElementById('hexagramVisual');
  visual.innerHTML = '';

  lines.forEach((lineVal, idx) => {
    const lineDiv = document.createElement('div');
    lineDiv.className = lineVal === 1 ? 'line-yang' : 'line-yin';
    if(idx + 1 === moveLine) {
      lineDiv.style.border = '1px solid var(--accent-gold)';
    }
    visual.appendChild(lineDiv);
  });

  const hexName = `${upper.nature}(${upper.name.split('/')[0]})ㆍ${lower.nature}(${lower.name.split('/')[0]})`;
  document.getElementById('ichingTitle').innerText = `주역 卦 : [ ${upper.name} / ${lower.name} ] - ${hexName} 괘`;
  document.getElementById('ichingDesc').innerText = `상괘의 ${upper.nature} 기운(${upper.element})과 하괘의 ${lower.nature} 기운(${lower.element})이 조화를 이루고 있습니다. 변화의 중심은 제 ${moveLine}효에 있습니다.`;
}

function generateReport(name, star, upper, lower, moveLine, year, birthtime) {
  // 1. 명궁 주성 리포트
  document.getElementById('mainStarReport').innerHTML = `
    <strong>${name}</strong>님의 명궁 주성은 <strong>${star.name}</strong>입니다.<br>
    ${star.desc} 기본적으로 자기 주관이 뚜렷하며 상황을 빠르게 파악하는 능력이 뛰어납니다. 
    자신의 장점인 계획성과 실행력을 균형 있게 발휘할 때 명예와 안정을 동시에 얻게 됩니다.
  `;

  // 2. 재물운 & 직업운 (상괘 + 출생시 조합)
  let wealthAdvice = "";
  if(upper.lines[0] === 1) {
    wealthAdvice = "추진력 있고 주도적인 업무 환경에서 재물운이 크게 상승합니다. 스스로 판단하여 움직일 수 있는 독립적인 직무나 사업이 유리합니다.";
  } else {
    wealthAdvice = "사람들과의 협업 및 차분한 자산 관리에서 재물이 쌓입니다. 안정을 바탕으로 한 꾸준한 투자와 자원 관리가 성과를 가져옵니다.";
  }
  
  let timeNote = (birthtime % 2 === 0) ? " 오전/주간의 활동성이 재물 기운을 밝혀줍니다." : " 야간 및 차분한 구상의 시간이 재물운을 보완해 줍니다.";

  document.getElementById('wealthReport').innerHTML = `
    상괘인 <strong>${upper.name}</strong>의 영향으로, ${wealthAdvice}${timeNote}
    꾸준히 자산을 축적하는 운이며 성급한 한판승부보다는 지혜로운 분산 관리가 길합니다.
  `;

  // 3. 애정운 & 대인관계 (하괘 조합)
  let relationText = "";
  if(lower.nature === "못" || lower.nature === "불" || lower.nature === "바람") {
    relationText = "대인관계가 매우 활발하며 밝고 긍정적인 인상을 주는 편입니다. 솔직한 대화와 세심한 배려가 연인 및 주변 관계를 더욱 공고하게 만들어 줍니다.";
  } else {
    relationText = "깊고 진중한 인간관계를 선호합니다. 신뢰를 바탕으로 한 오랜 인연과의 관계가 길하며, 서두르지 않고 진심을 전하는 것이 핵심입니다.";
  }

  document.getElementById('relationReport').innerHTML = `
    하괘인 <strong>${lower.name}</strong>의 특성에 따라 ${relationText}
  `;

  // 4. 주역 행동 지침 (동효 기반)
  const actionGuides = [
    "초효의 움직임: 현재는 준비 단계입니다. 기초를 튼튼히 하고 계획을 점검하세요.",
    "이효의 움직임: 귀인을 만나는 시기입니다. 주변의 자문과 조언을 적극적으로 받아들이세요.",
    "삼효의 움직임: 신중함이 필요한 때입니다. 조급하게 결정을 내리지 말고 상황을 관망하세요.",
    "사효의 움직임: 도약의 기회가 다가오고 있습니다. 소신 있게 실행에 옮기세요.",
    "오효의 움직임: 결실을 맺는 절정의 순간입니다. 겸손함을 유지하면 큰 명예가 따릅니다.",
    "육효의 움직임: 과유불급을 경계해야 합니다. 성과를 나누고 마음을 가다듬으세요."
  ];

  document.getElementById('actionReport').innerHTML = `
    현재 괘의 변화점은 <strong>제 ${moveLine}효</strong>입니다.<br>
    👉 <em>${actionGuides[moveLine - 1]}</em>
  `;
}
</script>

</body>
</html>
