<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자미두수 & 주역 사주 운세 풀이</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent-gold: #ffd700;
      --accent-purple: #9d4edd;
      --text-light: #e0e0e0;
      --border-color: #3a3252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: 'Malgun Gothic', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-purple);
    }
    header h1 {
      color: var(--accent-gold);
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* 입력 폼 스타일 */
    .input-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      margin-bottom: 6px;
      color: var(--accent-gold);
      font-weight: bold;
    }
    .form-group input, .form-group select {
      padding: 10px;
      background: #251f3d;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple), #5a189a);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #7b2cbf, #3c096c);
      box-shadow: 0 0 10px var(--accent-purple);
    }

    /* 결과 영역 */
    #result-area { display: none; }

    .section-title {
      color: var(--accent-gold);
      border-left: 4px solid var(--accent-purple);
      padding-left: 10px;
      margin: 30px 0 15px 0;
      font-size: 1.5rem;
    }

    /* 자미두수 12궁 그리드 레이아웃 */
    .ziwei-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 30px;
    }
    .ziwei-cell {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      min-height: 120px;
      position: relative;
    }
    .ziwei-cell.center-cell {
      grid-column: span 2;
      grid-row: span 2;
      background: #151022;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid var(--accent-purple);
    }
    .palace-name {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 0.9rem;
    }
    .branch-name {
      position: absolute;
      bottom: 6px;
      left: 8px;
      color: #888;
      font-size: 0.8rem;
    }
    .stars-main {
      color: #ff4d4d;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .stars-sub {
      color: #4da6ff;
      font-size: 0.8rem;
    }

    /* 주역 괘 시각화 */
    .iching-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 30px;
    }
    .hexagram-visual {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      width: 120px;
    }
    .line-yang {
      height: 12px;
      background: var(--accent-gold);
      border-radius: 2px;
    }
    .line-yin {
      height: 12px;
      display: flex;
      justify-content: space-between;
    }
    .line-yin::before, .line-yin::after {
      content: '';
      width: 45%;
      height: 100%;
      background: #777;
      border-radius: 2px;
    }

    /* 풀이 리포트 카드 */
    .report-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .report-card h3 {
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .ziwei-grid { grid-template-columns: repeat(2, 1fr); }
      .ziwei-cell.center-cell { grid-column: span 2; grid-row: span 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>☯ 자미두수 & 주역 사주 풀이</h1>
    <p>생년월일시를 입력하면 자미두수 명반과 주역 괘를 분석하여 상세한 운세를 풀이합니다.</p>
  </header>

  <!-- 입력 폼 -->
  <div class="input-card">
    <form id="sajuForm">
      <div class="form-grid">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="username" value="홍길동" required>
        </div>
        <div class="form-group">
          <label>성별</label>
          <select id="gender">
            <option value="남">남성 (陽/陰)</option>
            <option value="여">여성 (陽/陰)</option>
          </select>
        </div>
        <div class="form-group">
          <label>생년월일</label>
          <input type="date" id="birthdate" value="1995-05-15" required>
        </div>
        <div class="form-group">
          <label>출생 시간</label>
          <select id="birthtime">
            <option value="0">자시 (23:00 ~ 01:00)</option>
            <option value="1">축시 (01:00 ~ 03:00)</option>
            <option value="2">인시 (03:00 ~ 05:00)</option>
            <option value="3">묘시 (05:00 ~ 07:00)</option>
            <option value="4">진시 (07:00 ~ 09:00)</option>
            <option value="5" selected>사시 (09:00 ~ 11:00)</option>
            <option value="6">오시 (11:00 ~ 13:00)</option>
            <option value="7">미시 (13:00 ~ 15:00)</option>
            <option value="8">신시 (15:00 ~ 17:00)</option>
            <option value="9">유시 (17:00 ~ 19:00)</option>
            <option value="10">술시 (19:00 ~ 21:00)</option>
            <option value="11">해시 (21:00 ~ 23:00)</option>
          </select>
        </div>
      </div>
      <button type="submit" class="submit-btn">🔮 사주 & 운세 풀이 보기</button>
    </form>
  </div>

  <!-- 결과 영역 -->
  <div id="result-area">
    
    <!-- 자미두수 12궁 명반 -->
    <h2 class="section-title">✨ 자미두수(紫微斗數) 12궁 명반</h2>
    <div class="ziwei-grid" id="ziweiBoard">
      <!-- 자바스크립트로 12궁 자동 생성 -->
    </div>

    <!-- 주역 64괘 분석 -->
    <h2 class="section-title">☯ 주역(周易) 괘 분석</h2>
    <div class="iching-box">
      <div class="hexagram-visual" id="hexagramVisual">
        <!-- 효 시각화 -->
      </div>
      <div>
        <h3 id="ichingTitle" style="color: var(--accent-gold); margin-bottom: 8px;"></h3>
        <p id="ichingDesc" style="color: #ccc;"></p>
      </div>
    </div>

    <!-- 상세 운세 리포트 -->
    <h2 class="section-title">📜 종합 운세 풀이</h2>
    <div class="report-card">
      <h3>🌟 총운 (선천적 명운)</h3>
      <p id="overallReport"></p>
    </div>
    <div class="report-card">
      <h3>💰 재물운 & 직업운</h3>
      <p id="careerReport"></p>
    </div>
    <div class="report-card">
      <h3>❤️ 애정운 & 대인관계</h3>
      <p id="loveReport"></p>
    </div>

  </div>
</div>

<script>
// 지지 및 천간 배열
const BRANCHES = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];
const PALACES = ["명궁(命宮)", "형제궁", "부처궁", "자녀궁", "재백궁", "질악궁", "천이궁", "노복궁", "관록궁", "전택궁", "복덕궁", "부모궁"];
const MAIN_STARS = ["자미(紫微)", "천기(天機)", "태양(太陽)", "무곡(武曲)", "천동(天同)", "염정(廉貞)", "천부(天府)", "태음(太陰)", "탐랑(貪狼)", "거문(巨門)", "천상(天相)", "천량(天梁)", "칠살(七殺)", "파군(破軍)"];
const SUB_STARS = ["좌보", "우필", "문창", "문곡", "록존", "천괴", "천월", "경양", "타라", "화성", "령성"];

// 주역 8괘 데이터 (0: 음, 1: 양)
const TRIGRAMS = [
  { name: "천(天/건)", lines: [1, 1, 1] },
  { name: "택(澤/태)", lines: [1, 1, 0] },
  { name: "화(火/리)", lines: [1, 0, 1] },
  { name: "뢰(雷/진)", lines: [1, 0, 0] },
  { name: "풍(風/손)", lines: [0, 1, 1] },
  { name: "수(水/감)", lines: [0, 1, 0] },
  { name: "산(山/간)", lines: [0, 0, 1] },
  { name: "지(地/곤)", lines: [0, 0, 0] }
];

document.getElementById('sajuForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const name = document.getElementById('username').value;
  const gender = document.getElementById('gender').value;
  const birthdate = new Date(document.getElementById('birthdate').value);
  const birthtime = parseInt(document.getElementById('birthtime').value);

  const year = birthdate.getFullYear();
  const month = birthdate.getMonth() + 1;
  const day = birthdate.getDate();

  // 1. 자미두수 계산 (명궁 위치 및 별 배치)
  // 명궁 위치 공식: (월 - 시 + 12) % 12
  let mingIndex = (month - birthtime + 12) % 12;
  
  generateZiweiBoard(name, year, month, day, mingIndex);

  // 2. 주역 괘 계산 (년+월+일) % 8, (년+월+일+시) % 8
  let upperIdx = (year + month + day) % 8;
  let lowerIdx = (year + month + day + birthtime) % 8;
  let moveLine = ((year + month + day + birthtime) % 6) + 1;

  generateIching(upperIdx, lowerIdx, moveLine);

  // 3. 풀이 리포트 생성
  generateReport(name, mingIndex, upperIdx, lowerIdx);

  // 결과 영역 표시
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
});

function generateZiweiBoard(name, year, month, day, mingIdx) {
  const board = document.getElementById('ziweiBoard');
  board.innerHTML = '';

  // 12궁 배치 순서
  let palaceMap = {};
  for(let i = 0; i < 12; i++) {
    let idx = (mingIdx + i) % 12;
    palaceMap[idx] = PALACES[i];
  }

  // 12지에 따른 배치 그리드 (4x4)
  const gridPositions = [
    { row: 4, col: 1, branch: 0 },  // 자
    { row: 4, col: 2, branch: 1 },  // 축
    { row: 4, col: 3, branch: 2 },  // 인
    { row: 4, col: 4, branch: 3 },  // 묘
    { row: 3, col: 4, branch: 4 },  // 진
    { row: 2, col: 4, branch: 5 },  // 사
    { row: 1, col: 4, branch: 6 },  // 오
    { row: 1, col: 3, branch: 7 },  // 미
    { row: 1, col: 2, branch: 8 },  // 신
    { row: 1, col: 1, branch: 9 },  // 유
    { row: 2, col: 1, branch: 10 }, // 술
    { row: 3, col: 1, branch: 11 }  // 해
  ];

  // 중앙 셀 추가
  const centerCell = document.createElement('div');
  centerCell.className = 'ziwei-cell center-cell';
  centerCell.innerHTML = `
    <h3 style="color:var(--accent-gold);">${name} 님의 명반</h3>
    <p style="margin-top:8px; font-size:0.9rem; color:#aaa;">${year}년 ${month}월 ${day}일생</p>
    <p style="font-size:0.85rem; color:var(--accent-purple); margin-top:5px;">[ 자미두수 12궁 배치 완료 ]</p>
  `;

  // 셀 생성 및 배치
  gridPositions.forEach((pos) => {
    const cell = document.createElement('div');
    cell.className = 'ziwei-cell';
    cell.style.gridRow = pos.row;
    cell.style.gridColumn = pos.col;

    // 별 임의 배치 (생년월일 기반 시뮬레이션 계산)
    let mainStar = MAIN_STARS[(pos.branch + year) % MAIN_STARS.length];
    let subStar = SUB_STARS[(pos.branch + month) % SUB_STARS.length];

    cell.innerHTML = `
      <div class="stars-main">${mainStar}</div>
      <div class="stars-sub">${subStar}</div>
      <div class="palace-name">${palaceMap[pos.branch]}</div>
      <div class="branch-name">${BRANCHES[pos.branch]}</div>
    `;

    board.appendChild(cell);
  });

  board.appendChild(centerCell);
}

function generateIching(upperIdx, lowerIdx, moveLine) {
  const upper = TRIGRAMS[upperIdx];
  const lower = TRIGRAMS[lowerIdx];
  
  // 6효 조합 (하괘 3효 + 상괘 3효)
  const lines = [...lower.lines, ...upper.lines];

  const visual = document.getElementById('hexagramVisual');
  visual.innerHTML = '';

  lines.forEach((lineVal, idx) => {
    const lineDiv = document.createElement('div');
    if(lineVal === 1) {
      lineDiv.className = 'line-yang';
    } else {
      lineDiv.className = 'line-yin';
    }
    // 동효 표시
    if(idx + 1 === moveLine) {
      lineDiv.style.border = '1px solid var(--accent-gold)';
    }
    visual.appendChild(lineDiv);
  });

  const hexName = `${upper.name.split('(')[0]}${lower.name.split('(')[0]}`;
  document.getElementById('ichingTitle').innerText = `주역 卦 : [ ${upper.name} / ${lower.name} ] - ${hexName}괘`;
  document.getElementById('ichingDesc').innerText = `현재 변화의 핵심은 제 ${moveLine}효(動爻)에 있습니다. 상괘의 ${upper.name} 성질과 하괘의 ${lower.name} 성질이 결합하여 현재의 정세와 미래의 변화를 암시합니다.`;
}

function generateReport(name, mingIdx, upperIdx, lowerIdx) {
  const overallTexts = [
    `${name}님은 자미두수 명궁이 강한 독립성과 결단력을 상징하는 위치에 배치되어 있습니다. 직관력이 뛰어나며 새로운 일에 도전할 때 성과가 큽니다.`,
    `${name}님은 온화하고 신중한 성품을 바탕으로 사람들과의 협력을 통해 성취를 이루는 운입니다. 주변의 도움과 인복이 두터운 편입니다.`,
    `${name}님은 분석적이고 창의적인 지혜를 가지고 있어 전문적인 분야나 기획, 학문 쪽에서 두각을 나타낼 사주 구조입니다.`
  ];

  const careerTexts = [
    `재백궁과 관록궁의 별들이 길성의 호위를 받고 있습니다. 자산 관리와 꾸준한 투자가 유리하며, 직장 및 사업에서 주도적인 역할을 맡을 때 재물이 따릅니다.`,
    `변화와 이동이 많은 기운입니다. 한곳에 머무르기보다는 다양성을 시도하거나 네트워크를 확충할 때 재물 운이 상승합니다.`
  ];

  const loveTexts = [
    `부처궁에 온화한 기운이 감돌아 서로 존중하고 배려하는 인연을 만나게 됩니다. 대인관계에서는 솔직한 소통이 관계 개선의 핵심입니다.`,
    `상대방에게 주도권을 주기보다 서로의 영역을 인정할 때 관계가 더욱 공고해집니다. 가을과 겨울에 귀인의 도움을 받을 운입니다.`
  ];

  document.getElementById('overallReport').innerText = overallTexts[mingIdx % overallTexts.length];
  document.getElementById('careerReport').innerText = careerTexts[upperIdx % careerTexts.length];
  document.getElementById('loveReport').innerText = loveTexts[lowerIdx % loveTexts.length];
}
</script>

</body>
</html>
